<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>단어 3</title>
  <meta name="description" content="작은 창에 띄워 두고 보는 영어 단어 암기 앱">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="단어 3">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 집중 화면 -->
  <div id="focus" class="focus">
    <header class="bar">
      <button id="modeBtn" class="btn bar-btn" type="button" aria-label="보기 모드 전환">모두 보기</button>
      <button id="nextBtn" class="btn bar-btn primary" type="button" aria-label="다음 3개">다음 3개 ›</button>
      <button id="settingsBtn" class="btn bar-btn icon" type="button" aria-label="설정">⚙︎</button>
    </header>
    <main id="cards" class="cards" aria-live="polite"></main>
  </div>

  <!-- 설정 화면 -->
  <div id="settings" class="settings" hidden>
    <header class="bar settings-bar">
      <h1>설정</h1>
      <button id="closeSettingsBtn" class="btn bar-btn primary" type="button">완료</button>
    </header>
    <div class="settings-body">

      <section class="group">
        <h2>보기</h2>
        <div class="row">
          <span class="label">테마</span>
          <div class="seg" id="themeSeg" role="radiogroup" aria-label="테마">
            <button type="button" class="btn" data-value="system">시스템</button>
            <button type="button" class="btn" data-value="light">라이트</button>
            <button type="button" class="btn" data-value="dark">다크</button>
          </div>
        </div>
        <div class="row">
          <span class="label">다음 묶음</span>
          <div class="seg" id="orderSeg" role="radiogroup" aria-label="다음 묶음 순서">
            <button type="button" class="btn" data-value="seq">순서대로</button>
            <button type="button" class="btn" data-value="random">랜덤</button>
          </div>
        </div>
        <div class="row">
          <label class="label" for="fontRange">글자 크기 <span id="fontValue" class="sub-inline"></span></label>
          <input id="fontRange" class="range" type="range" min="0.6" max="1.6" step="0.05">
        </div>
        <div class="row">
          <span class="label">자동 넘김</span>
          <div class="seg" id="autoSeg" role="radiogroup" aria-label="자동 넘김">
            <button type="button" class="btn" data-value="0">끄기</button>
            <button type="button" class="btn" data-value="30">30초</button>
            <button type="button" class="btn" data-value="60">1분</button>
          </div>
        </div>
        <div class="row">
          <span class="label">외운 단어<span class="sub">✓ 표시한 단어를 묶음에서 뺄지</span></span>
          <div class="seg" id="knownSeg" role="radiogroup" aria-label="외운 단어">
            <button type="button" class="btn" data-value="hide">빼기</button>
            <button type="button" class="btn" data-value="show">포함</button>
          </div>
        </div>
        <div class="row">
          <span class="label">화면 꺼짐 방지<span id="wakeStatus" class="sub"></span></span>
          <div class="seg" id="wakeSeg" role="radiogroup" aria-label="화면 꺼짐 방지">
            <button type="button" class="btn" data-value="off">끄기</button>
            <button type="button" class="btn" data-value="on">켜기</button>
          </div>
        </div>
        <p class="hint">? 헷갈림 표시한 단어는 랜덤에서 3배 자주, 순서대로에서는 두 묶음마다 한 번씩 섞여 나옵니다.</p>
      </section>

      <section class="group">
        <h2>단어 추가</h2>
        <form id="addForm" class="add-form" autocomplete="off">
          <input id="addEn" class="input" type="text" placeholder="영어 (예: apple)" autocapitalize="off" autocorrect="off" spellcheck="false" required>
          <input id="addKo" class="input" type="text" placeholder="뜻 (예: 사과)" required>
          <button class="btn primary" type="submit">추가</button>
        </form>
      </section>

      <section class="group">
        <h2>여러 단어 붙여넣기</h2>
        <p class="hint">한 줄에 하나씩 <code>apple, 사과</code> 형식. 첫 번째 쉼표 앞이 영어, 뒤가 뜻입니다.</p>
        <textarea id="bulkText" class="input textarea" rows="5" placeholder="apple, 사과&#10;run, 달리다, 운영하다" autocapitalize="off" autocorrect="off" spellcheck="false"></textarea>
        <button id="bulkBtn" class="btn primary" type="button">한꺼번에 추가</button>
        <p id="bulkResult" class="result" role="status"></p>
      </section>

      <section class="group">
        <h2>단어 목록 <span id="wordCount" class="count"></span></h2>
        <ul id="wordList" class="word-list"></ul>
      </section>

      <section class="group">
        <h2>백업</h2>
        <div class="btn-row">
          <button id="exportBtn" class="btn" type="button">JSON 내보내기</button>
          <button id="importBtn" class="btn" type="button">JSON 가져오기</button>
          <input id="importFile" type="file" accept="application/json,.json" hidden>
        </div>
        <p id="backupResult" class="result" role="status"></p>
        <div class="btn-row">
          <button id="resetBtn" class="btn danger" type="button">샘플 단어로 초기화</button>
        </div>
      </section>

    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="app.js"></script>
</body>
</html>
